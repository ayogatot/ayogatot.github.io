<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SnapStash by DANMAJI</title>
  <meta name="description" content="Turn anything into a collectible pop-art trading card with SnapStash." />
  <style>
    :root {
      --bg: #141B3D;
      --card-bg: #FFF4DC;
      --yellow: #FFD23F;
      --teal: #2EC4B6;
      --ink: #111111;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .container {
      max-width: 580px;
      width: 100%;
      background: var(--card-bg);
      border: 4px solid var(--ink);
      border-radius: 28px;
      box-shadow: 8px 8px 0 var(--ink);
      padding: 40px 28px;
      text-align: center;
    }
    .icon {
      width: 120px;
      height: 120px;
      border-radius: 26px;
      border: 4px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      margin-bottom: 20px;
      object-fit: cover;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 1.1rem;
      font-weight: 700;
      color: #555;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: var(--yellow);
      border: 2px solid var(--ink);
      border-radius: 20px;
      padding: 6px 16px;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 3px 3px 0 var(--ink);
      margin-bottom: 24px;
    }
    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--teal);
      color: var(--ink);
      font-size: 1.15rem;
      font-weight: 800;
      text-decoration: none;
      padding: 16px 32px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      margin-bottom: 28px;
    }
    .cta-button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--ink);
    }
    .cta-button:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .footer-links {
      border-top: 2px dashed #D0C6B0;
      padding-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .footer-links a {
      color: #0b6e65;
      text-decoration: none;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
    .dev-by {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="icon.png" alt="SnapStash App Icon" class="icon" />
    <h1>SnapStash</h1>
    <div class="tagline">Snap it. Sticker it. Stash it!</div>
    <div class="badge">NOW LIVE ON GOOGLE PLAY</div>
    <div>
      <a href="https://play.google.com/store/apps/details?id=com.snaptash.app" class="cta-button" target="_blank" rel="noopener">
        <span>Get it on Google Play</span> &rarr;
      </a>
    </div>
    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a>
      <span>&bull;</span>
      <a href="app-ads.txt">app-ads.txt</a>
      <span>&bull;</span>
      <a href="mailto:ayogatot@gmail.com">Contact Support</a>
    </div>
    <div class="dev-by">&copy; 2026 DANMAJI &bull; All Rights Reserved</div>
  </div>
</body>
</html>
